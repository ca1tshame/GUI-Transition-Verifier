name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  verify-cpu:
    name: CPU Audit and Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1,<3.0"
          python -m pip install ".[dev]"

      - name: Run repository audit (worktree)
        run: python -B tools/audit_repo.py

      - name: Run repository audit (tracked-only)
        run: python -B tools/audit_repo.py --tracked-only

      - name: Run CPU unit test suite
        run: python -B -m pytest -p no:cacheprovider -v

      - name: Recompute and verify V5 results
        run: python -B -m eval.v5_recompute
