[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gui-agent-posttraining"
version = "0.2.0"
description = "Multimodal GUI policy post-training, cross-domain semantic transition verification, native tool-use protocol alignment, process reward modeling, and Conv3d-free operator acceleration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
torch = [
    "torch>=2.1,<3.0",
]
qwen = [
    "transformers>=4.45,<5.0",
    "peft>=0.10,<1.0",
    "Pillow>=10.0,<12.0",
]
dev = [
    "pytest>=7.4,<9.0",
]
all = [
    "torch>=2.1,<3.0",
    "transformers>=4.45,<5.0",
    "peft>=0.10,<1.0",
    "Pillow>=10.0,<12.0",
    "pytest>=7.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "fastpe*",
    "protocols*",
    "diagnostics*",
    "eval*",
    "training*",
    "prm*",
    "policy*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
